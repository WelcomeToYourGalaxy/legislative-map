name: Global Wire

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install feedparser
      - name: Harvest feeds
        run: python3 wire_harvest.py
      - name: Commit updates
        run: |
          git config user.name "wire-bot"
          git config user.email "wire-bot@users.noreply.github.com"
          git add wire_archive.json
          git commit -m "wire: update shared archive" || echo "no changes"
          git push
